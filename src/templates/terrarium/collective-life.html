<section class="panel soil-panel">
  <div class="section-label">
    <span data-i18n="terrarium.family.title"></span><span>↔</span>
  </div>
  <dl id="family-metrics" class="status-metrics">
    <div>
      <dt data-i18n="interface.metrics.colonies"></dt>
      <dd data-metric="colonies">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.queens"></dt>
      <dd data-metric="queens">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.alates"></dt>
      <dd data-metric="alates">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.alateReserve"></dt>
      <dd data-metric="alateReserve">—</dd>
    </div>
  </dl>
  <details class="metric-details">
    <summary data-i18n="interface.metrics.more"></summary>
    <p id="family-status" data-i18n="terrarium.family.initial"></p>
    <p id="daughter-status"></p>
  </details>
  <p
    id="founding-status"
    role="status"
    aria-live="off"
    data-i18n="terrarium.founding.wait"
  ></p>
  <button
    id="focus-sealing"
    class="secondary-action"
    data-disabled-reason="focus-sealing-reason"
    disabled
    data-i18n="terrarium.sealing.focus"
  ></button>
  <p
    class="secondary-action-reason"
    id="focus-sealing-reason"
    hidden
    data-i18n="terrarium.action.focus-sealing.reason"
  ></p>
  <p id="fertility-status" class="field-note" hidden></p>
  <div id="survival-panel" hidden></div>
  <p id="store-status" class="field-note" hidden></p>
  <p id="development-status" hidden></p>
  <button
    id="focus-brood"
    class="secondary-action"
    data-disabled-reason="focus-brood-reason"
    disabled
    data-i18n="terrarium.brood.focus"
  ></button>
  <p
    class="secondary-action-reason"
    id="focus-brood-reason"
    hidden
    data-i18n="terrarium.action.focus-brood.reason"
  ></p>
  <div id="season-panel" hidden>
    <p id="season-status"></p>
    <div class="slider-block">
      <label for="photoperiod"
        ><span data-i18n="terrarium.photoperiod"></span>
        <output id="photoperiod-value">12 h</output></label
      ><input
        id="photoperiod"
        type="range"
        min="0"
        max="24"
        step="0.5"
        value="12"
        data-i18n-aria-label="terrarium.photoperiod"
      />
    </div>
  </div>
  <p id="chemical-status"></p>
  <div
    id="odor-legend"
    role="group"
    class="odor-legend"
    data-i18n-aria-label="terrarium.odor.label"
  ></div>
  <p id="colony-status" data-i18n="terrarium.colony.initial"></p>
</section>
