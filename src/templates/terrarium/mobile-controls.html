<dialog id="mobile-controls" aria-labelledby="mobile-controls-title">
  <header class="mobile-controls-heading">
    <h2 id="mobile-controls-title" data-i18n="interface.drawer.title"></h2>
    <button
      type="button"
      id="mobile-controls-close"
      data-i18n="interface.drawer.close"
    ></button>
  </header>
  <div
    class="panel-tabs"
    role="tablist"
    aria-labelledby="mobile-controls-title"
  >
    <button
      type="button"
      id="drawer-tab-environment"
      role="tab"
      aria-controls="drawer-environment"
      aria-selected="true"
      data-i18n="interface.drawer.environment"
    ></button>
    <button
      type="button"
      id="drawer-tab-intervention"
      role="tab"
      aria-controls="drawer-intervention"
      aria-selected="false"
      tabindex="-1"
      data-i18n="interface.drawer.intervene"
    ></button>
    <button
      type="button"
      id="drawer-tab-time"
      role="tab"
      aria-controls="drawer-time"
      aria-selected="false"
      tabindex="-1"
      data-i18n="interface.drawer.time"
    ></button>
    <button
      type="button"
      id="drawer-tab-data"
      role="tab"
      aria-controls="drawer-data"
      aria-selected="false"
      tabindex="-1"
      data-i18n="interface.tabs.data"
    ></button>
  </div>
  <div class="mobile-controls-body">
    <div
      id="drawer-environment"
      role="tabpanel"
      aria-labelledby="drawer-tab-environment"
      tabindex="0"
    ></div>
    <div
      id="drawer-intervention"
      role="tabpanel"
      aria-labelledby="drawer-tab-intervention"
      tabindex="0"
      hidden
    ></div>
    <div
      id="drawer-time"
      role="tabpanel"
      aria-labelledby="drawer-tab-time"
      tabindex="0"
      hidden
    ></div>
    <div
      id="drawer-data"
      role="tabpanel"
      aria-labelledby="drawer-tab-data"
      tabindex="0"
      hidden
    ></div>
  </div>
</dialog>
