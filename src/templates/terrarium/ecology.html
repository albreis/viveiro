<section class="panel soil-panel">
  <div class="section-label">
    <span data-i18n="terrarium.ecology.title"></span><span>⚘</span>
  </div>
  <dl id="ecology-metrics" class="status-metrics">
    <div>
      <dt data-i18n="interface.metrics.aphids"></dt>
      <dd data-metric="aphids">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.aphidPlants"></dt>
      <dd data-metric="aphidPlants">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.honeydew"></dt>
      <dd data-metric="honeydew">—</dd>
    </div>
  </dl>
  <details class="metric-details">
    <summary data-i18n="interface.metrics.more"></summary>
    <p id="ecology-status" data-i18n="terrarium.ecology.initial"></p>
    <p data-i18n="terrarium.ecology.help"></p>
  </details>
  <button
    id="focus-ecology"
    class="secondary-action"
    data-disabled-reason="focus-ecology-reason"
    disabled
    data-i18n="terrarium.ecology.focus"
  ></button>
  <p
    class="secondary-action-reason"
    id="focus-ecology-reason"
    hidden
    data-i18n="terrarium.action.focus-ecology.reason"
  ></p>
</section>
