<section class="panel soil-panel">
  <div class="section-label">
    <span data-i18n="terrarium.gas.title"></span><span>≈</span>
  </div>
  <dl id="gas-metrics" class="status-metrics">
    <div>
      <dt data-i18n="interface.metrics.oxygen"></dt>
      <dd data-metric="oxygen">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.carbon"></dt>
      <dd data-metric="carbon">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.entrances"></dt>
      <dd data-metric="entrances">—</dd>
    </div>
  </dl>
  <details class="metric-details">
    <summary data-i18n="interface.metrics.more"></summary>
    <p id="gas-status"></p>
    <p class="field-note" data-i18n="terrarium.gas.help"></p>
  </details>
  <canvas
    id="gas-map"
    width="280"
    height="112"
    role="img"
    data-i18n-aria-label="terrarium.gas.map"
  ></canvas>
  <div class="slider-block">
    <label for="wind"
      ><span data-i18n="terrarium.wind"></span
      ><output id="wind-value">0 u.</output></label
    >
    <input id="wind" type="range" min="-4" max="4" step="0.5" value="0" />
    <p class="field-note" data-i18n="terrarium.wind.help"></p>
  </div>
</section>
