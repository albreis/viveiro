<div id="comparison-panel" class="comparison-strip" hidden>
  <div>
    <span class="eyebrow" data-i18n="terrarium.comparison.title"></span>
    <p id="comparison-text" data-i18n="terrarium.comparison.initial"></p>
  </div>
  <div class="scenario-switch">
    <button
      data-scenario="a"
      class="active"
      data-i18n="terrarium.comparison.a"
    ></button
    ><button data-scenario="b" data-i18n="terrarium.comparison.b"></button>
  </div>
</div>
