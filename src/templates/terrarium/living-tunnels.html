<section class="panel soil-panel">
  <div class="section-label">
    <span data-i18n="terrarium.tunnels.title"></span><span>↓</span>
  </div>
  <dl id="soil-metrics" class="status-metrics">
    <div>
      <dt data-i18n="interface.metrics.fronts"></dt>
      <dd data-metric="fronts">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.digging"></dt>
      <dd data-metric="digging">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.hauling"></dt>
      <dd data-metric="hauling">—</dd>
    </div>
    <div>
      <dt data-i18n="interface.metrics.looseSoil"></dt>
      <dd data-metric="looseSoil">—</dd>
    </div>
  </dl>
  <details class="metric-details">
    <summary data-i18n="interface.metrics.more"></summary>
    <p id="soil-status" data-i18n="terrarium.tunnels.initial"></p>
    <p id="granular-status"></p>
    <p id="structure-status"></p>
  </details>
  <button
    id="focus-structure"
    class="secondary-action"
    data-disabled-reason="focus-structure-reason"
    disabled
    data-i18n="terrarium.structure.focus"
  ></button>
  <p
    class="secondary-action-reason"
    id="focus-structure-reason"
    hidden
    data-i18n="terrarium.action.focus-structure.reason"
  ></p>
  <button
    id="disturb"
    class="secondary-action"
    data-i18n="terrarium.structure.disturb"
  ></button>
</section>
