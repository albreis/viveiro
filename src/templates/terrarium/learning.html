<section class="panel soil-panel">
  <div class="section-label">
    <span data-i18n="terrarium.learning.title"></span><span>◇</span>
  </div>
  <p id="learning-status"></p>
  <label for="learning-mode" data-i18n="terrarium.learning.navigation"></label
  ><select id="learning-mode">
    <option value="aco">ACO</option>
    <option
      value="neural"
      disabled
      data-i18n="terrarium.learning.policy"
    ></option>
  </select>
  <p id="training-status" data-i18n="terrarium.learning.help"></p>
  <div class="learning-actions">
    <button
      id="train-policy"
      class="secondary-action"
      aria-describedby="training-status"
      data-i18n="terrarium.learning.train"
    ></button
    ><button
      id="apply-policy"
      class="secondary-action"
      data-disabled-reason="apply-policy-reason"
      aria-describedby="training-status"
      disabled
      data-i18n="terrarium.learning.apply"
    ></button>
    <p
      class="secondary-action-reason"
      id="apply-policy-reason"
      hidden
      data-i18n="terrarium.action.apply-policy.reason"
    ></p>
  </div>
</section>
